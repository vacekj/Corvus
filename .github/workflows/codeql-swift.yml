name: CodeQL (Swift)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 2"

jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rust-Universal-Lib (arm64 + x86_64) – VOR init, damit der Cargo-Build
      # nicht unter dem CodeQL-Tracer läuft. --release ist Pflicht, weil
      # Package.swift hart auf signal-backend/target/release zeigt.
      - name: Build corvus-core (universal staticlib)
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --manifest-path signal-backend/Cargo.toml -p corvus-core
          cargo build --release --locked --manifest-path signal-backend/Cargo.toml -p corvus-core --target x86_64-apple-darwin
          lipo -create \
            signal-backend/target/release/libcorvus_core.a \
            signal-backend/target/x86_64-apple-darwin/release/libcorvus_core.a \
            -output signal-backend/target/release/libcorvus_core_universal.a
          mv signal-backend/target/release/libcorvus_core_universal.a \
             signal-backend/target/release/libcorvus_core.a

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Dieser Build läuft unter Rosetta als x86_64 – die Universal-Lib deckt das ab.
      - name: Build Swift package
        run: swift build --package-path macos

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
