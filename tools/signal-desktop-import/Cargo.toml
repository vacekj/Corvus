[package]
name = "corvus-signal-import"
version = "0.1.0"
edition = "2021"
description = "Exports the local Signal Desktop history as Corvus history records (JSON lines)"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "corvus-signal-import"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
strip = true
