[workspace]
members = ["corvus-signal", "corvus-calls", "vendor/presage", "vendor/presage-store-sqlite", "vendor/libsignal-service-rs"]
# signal-call-tunnel (call-tunnel/) is its own workspace: it links RingRTC and prebuilt WebRTC.
exclude = ["call-tunnel"]

resolver = "2"

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
strip = true
lto = "thin"

# macOS 27's loader rejects some build-time proc-macro dylibs (sqlx-macros: "mis-aligned LINKEDIT
# string pool") when they are built at opt-level 3; build scripts and proc macros at opt-level 1 load fine.
[profile.release.build-override]
opt-level = 1

[patch.crates-io]
quickcheck_async = { git = 'https://github.com/nytopop/quickcheck_async', rev = '76b13525ca93e0725e757f841fc6ccab8bae1913' }
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = '2a42b3354c9194700d08aa070f70a131a470e7dc' }

# Vendored, patched copies (see vendor/README.md).
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service-rs" }
