[package]
name = "corvus-calls"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "1:1 voice call signaling for corvus-signal: drives signal-call-tunnel and relays CallMessages"
publish = false

[dependencies]
presage = { path = "../vendor/presage" }

base64 = "0.22"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "process", "io-util", "sync", "time", "test-util"] }
